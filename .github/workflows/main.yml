name: Build GRAVIX Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: gravix-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      GRAVIX_FIREBASE_API_KEY: ${{ secrets.GRAVIX_FIREBASE_API_KEY }}
      GRAVIX_FUNCTIONS_URL: ${{ vars.GRAVIX_FUNCTIONS_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OS build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential git zip unzip curl ca-certificates \
            pkg-config cmake ninja-build autoconf automake \
            libtool libltdl-dev libffi-dev libssl-dev zlib1g-dev \
            libncurses-dev python3-setuptools

      - name: Install Buildozer
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" "buildozer==1.5.0"

      - name: Create Firebase client configuration
        shell: bash
        run: |
          if [ -z "${GRAVIX_FIREBASE_API_KEY}" ]; then
            echo "Missing required secret: GRAVIX_FIREBASE_API_KEY"
            exit 1
          fi

          python - <<'PY'
          import os
          from pathlib import Path

          api_key = os.environ["GRAVIX_FIREBASE_API_KEY"]
          functions_url = (
              os.environ.get("GRAVIX_FUNCTIONS_URL")
              or "https://asia-southeast1-gravix-7b589.cloudfunctions.net"
          )

          Path("gravix_config.py").write_text(
              "FIREBASE_API_KEY = " + repr(api_key) + "\n"
              + "FIREBASE_FUNCTIONS_BASE_URL = " + repr(functions_url) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Cache Buildozer state
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: ${{ runner.os }}-buildozer-1.5.0-py311-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-1.5.0-py311-

      - name: Clean stale APK output
        shell: bash
        run: rm -rf bin

      - name: Build debug APK
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt ${attempt} of 3"
            if buildozer -v android debug; then
              echo "Build succeeded"
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              delay=$((15 * (2 ** (attempt - 1))))
              echo "Build failed; retrying in ${delay} seconds..."
              sleep "${delay}"
            fi
          done
          echo "All build attempts failed"
          exit 1

      - name: Save APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gravix-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
