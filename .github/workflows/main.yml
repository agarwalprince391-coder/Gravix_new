name: Build GRAVIX Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: gravix-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip openjdk-17-jdk \
            autoconf automake libtool libtool-bin libltdl-dev \
            pkg-config cmake m4 \
            zlib1g-dev libncurses-dev libtinfo6 libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install "Cython==0.29.36" "buildozer==1.5.0"

      - name: Create Firebase client configuration
        env:
          GRAVIX_FIREBASE_API_KEY: ${{ secrets.GRAVIX_FIREBASE_API_KEY }}
          GRAVIX_FUNCTIONS_URL: ${{ vars.GRAVIX_FUNCTIONS_URL }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          key = os.environ.get("GRAVIX_FIREBASE_API_KEY", "")
          if not key:
              raise SystemExit("Add the GRAVIX_FIREBASE_API_KEY repository secret before building.")
          functions_url = os.environ.get("GRAVIX_FUNCTIONS_URL") or (
              "https://asia-southeast1-gravix-7b589.cloudfunctions.net"
          )
          Path("gravix_config.py").write_text(
              "FIREBASE_API_KEY = " + repr(key) + "\n" +
              "FIREBASE_FUNCTIONS_BASE_URL = " + repr(functions_url) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Clean stale Buildozer state
        run: rm -rf .buildozer

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gravix-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
